[package]
name = "quickcsv"
version = "0.10.0"
edition = "2021"
description = "High-performance CSV viewer for macOS and Web"
authors = ["QuickCSV Team"]
license = "MIT"
repository = "https://github.com/ayu5h-raj/quickcsv"
default-run = "quickcsv"

[lib]
name = "quickcsv_lib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "quickcsv"
path = "src/main.rs"

# macOS App Bundle configuration
[package.metadata.bundle]
name = "QuickCSV"
identifier = "com.quickcsv.app"
icon = ["icons/icon.icns"]
version = "0.10.0"
copyright = "Copyright © 2026 QuickCSV Team"
category = "Developer Tool"
short_description = "High-performance CSV viewer"
long_description = """
FastCSV is a blazing-fast CSV viewer for macOS that handles files 
from 100MB to 2GB+ with zero lag using memory-mapped I/O and 
virtualized rendering.
"""
# File type associations
[package.metadata.bundle.osx]
minimum_system_version = "10.14"

[dependencies]
# GUI framework - immediate mode, native macOS support
eframe = { version = "0.33", features = ["default"] }

# Extended widgets including virtualized tables
egui_extras = { version = "0.33", features = ["default"] }

# CSV parsing - streaming, no full file load
csv = "1.3"

# Fast mutexes for thread synchronization
parking_lot = "0.12"

# Human-readable file sizes
humansize = "2.1"

# SIMD-accelerated byte searching for fast row indexing
memchr = "2.7"

# JSON parsing and formatting
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Phosphor icons for beautiful UI
egui-phosphor = { version = "0.11", default-features = false, features = ["regular"] }

# Native file dialogs (uses NSOpenPanel on macOS, JS file input on Web)
rfd = "0.16"

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Memory-mapped file I/O for zero-copy loading
memmap2 = "0.9"
# Config directory access
dirs = "5.0"

# Clipboard support
arboard = "3.4"

# HTTP client for update checking
ureq = "3.1"

# Image loading for app icon
image = { version = "0.25", default-features = false, features = ["png"] }

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["console", "Window", "Document", "HtmlElement", "File", "FileList", "FileReader", "HtmlInputElement"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
