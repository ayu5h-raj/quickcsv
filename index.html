<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<!-- Disable zooming: -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<head>
    <title>QuickCSV Web</title>
    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            /* Light mode background color for what is not covered by the egui canvas,
            or where the egui canvas is translucent. */
            background: #202020;
            color: #909090;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            height: 100%;
        }

        /* Position canvas in center-top */
        canvas {
            display: block;
            margin-right: auto;
            margin-left: auto;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        /* ---------------------------------------------- */
        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 64px;
            height: 64px;
            margin: 8px;
            border-radius: 50%;
            border: 6px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-02EQ3MT9HS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-02EQ3MT9HS');
    </script>
    
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-target-name="quickcsv" />
</head>

<body>
    <!-- The WASM code will reside here: -->
    <canvas id="the_canvas_id"></canvas>

    <!-- Loading text for when the WASM is still loading -->
    <div class="centered" id="center_text">
        <p style="font-size:16px">
            Loading QuickCSV...
        </p>
        <div class="lds-dual-ring"></div>
    </div>
</body>

</html>
