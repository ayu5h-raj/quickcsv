name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0, etc.

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build release binary
        run: cargo build --release

      - name: Create macOS app bundle
        run: cargo bundle --release

      - name: Create ZIP archive
        run: |
          cd target/release/bundle/osx
          zip -r QuickCSV-${{ github.ref_name }}-macos.zip QuickCSV.app
          mv QuickCSV-${{ github.ref_name }}-macos.zip ../../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickCSV-macos
          path: QuickCSV-${{ github.ref_name }}-macos.zip

  create-release:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: QuickCSV-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: QuickCSV ${{ github.ref_name }}
          body: |
            ## QuickCSV ${{ github.ref_name }}
            
            A blazing-fast CSV viewer for macOS that handles files from 100MB to 2GB+ with zero lag.
            
            ### Installation
            
            **Homebrew (Recommended)**
            ```bash
            brew tap ayu5h-raj/tap
            brew install --cask quickcsv
            ```
            
            **Manual Download**
            1. Download `QuickCSV-${{ github.ref_name }}-macos.zip`
            2. Unzip and drag `QuickCSV.app` to Applications
            3. Right-click and select "Open" (first time only)
            
            ### Features
            - 🚀 Instant file opening with memory-mapped I/O
            - 📊 Handle massive CSV files (2GB+)
            - 🔍 Fast search across millions of rows
            - ⚡ Smooth scrolling with virtualized rendering
          files: |
            QuickCSV-${{ github.ref_name }}-macos.zip
          draft: false
          prerelease: false

  update-homebrew:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Remove 'v' prefix for cask version
          CASK_VERSION="${VERSION#v}"
          
          # Download the release zip and calculate SHA256
          # Retry with exponential backoff - GitHub releases may not be immediately available
          MAX_RETRIES=5
          RETRY_DELAY=10
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -f -sL "https://github.com/ayu5h-raj/quickcsv/releases/download/${VERSION}/QuickCSV-${VERSION}-macos.zip" -o quickcsv.zip; then
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Failed to download release after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download failed, retrying in ${RETRY_DELAY}s... (attempt $i/$MAX_RETRIES)"
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          done
          SHA256=$(shasum -a 256 quickcsv.zip | cut -d' ' -f1)
          
          echo "Version: $CASK_VERSION"
          echo "SHA256: $SHA256"
          
          # Clone homebrew-tap repo
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ayu5h-raj/homebrew-tap.git
          cd homebrew-tap
          
          # Update the cask file
          cat > Casks/quickcsv.rb << 'CASKEOF'
cask "quickcsv" do
  version "CASK_VERSION_PLACEHOLDER"
  sha256 "SHA256_PLACEHOLDER"

  url "https://github.com/ayu5h-raj/quickcsv/releases/download/v#{version}/QuickCSV-v#{version}-macos.zip"
  name "QuickCSV"
  desc "High-performance CSV viewer for macOS"
  homepage "https://github.com/ayu5h-raj/quickcsv"

  # Remove quarantine attribute (app is not code-signed)
  postflight do
    system_command "/usr/bin/xattr",
                   args: ["-cr", "#{appdir}/QuickCSV.app"],
                   sudo: false
  end

  app "QuickCSV.app"

  zap trash: [
    "~/Library/Saved Application State/com.quickcsv.savedState",
  ]
end
CASKEOF
          
          # Replace placeholders with actual values
          sed -i "s/CASK_VERSION_PLACEHOLDER/${CASK_VERSION}/" Casks/quickcsv.rb
          sed -i "s/SHA256_PLACEHOLDER/${SHA256}/" Casks/quickcsv.rb
          
          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/quickcsv.rb
          git commit -m "Update QuickCSV to ${VERSION}"
          git push
