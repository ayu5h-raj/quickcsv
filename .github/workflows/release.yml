name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0, etc.

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build release binary
        run: cargo build --release

      - name: Create macOS app bundle
        run: cargo bundle --release

      - name: Create ZIP archive
        run: |
          cd target/release/bundle/osx
          zip -r QuickCSV-${{ github.ref_name }}-macos.zip QuickCSV.app
          mv QuickCSV-${{ github.ref_name }}-macos.zip ../../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickCSV-macos
          path: QuickCSV-${{ github.ref_name }}-macos.zip

  create-release:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: QuickCSV-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: QuickCSV ${{ github.ref_name }}
          body: |
            ## QuickCSV ${{ github.ref_name }}
            
            A blazing-fast CSV viewer for macOS that handles files from 100MB to 2GB+ with zero lag.
            
            ### Installation
            
            **Homebrew (Recommended)**
            ```bash
            brew tap ayu5h-raj/tap
            brew install --cask quickcsv
            ```
            
            **Manual Download**
            1. Download `QuickCSV-${{ github.ref_name }}-macos.zip`
            2. Unzip and drag `QuickCSV.app` to Applications
            3. Right-click and select "Open" (first time only)
            
            ### Features
            - 🚀 Instant file opening with memory-mapped I/O
            - 📊 Handle massive CSV files (2GB+)
            - 🔍 Fast search across millions of rows
            - ⚡ Smooth scrolling with virtualized rendering
          files: |
            QuickCSV-${{ github.ref_name }}-macos.zip
          draft: false
          prerelease: false

  update-homebrew:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Remove 'v' prefix for cask version
          CASK_VERSION="${VERSION#v}"
          
          # Download the release zip and calculate SHA256
          # Retry with exponential backoff - GitHub releases may not be immediately available
          MAX_RETRIES=5
          RETRY_DELAY=10
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -f -sL "https://github.com/ayu5h-raj/quickcsv/releases/download/${VERSION}/QuickCSV-${VERSION}-macos.zip" -o quickcsv.zip; then
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Failed to download release after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Download failed, retrying in ${RETRY_DELAY}s... (attempt $i/$MAX_RETRIES)"
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          done
          SHA256=$(shasum -a 256 quickcsv.zip | cut -d' ' -f1)
          
          echo "Version: $CASK_VERSION"
          echo "SHA256: $SHA256"
          
          # Clone homebrew-tap repo
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ayu5h-raj/homebrew-tap.git
          cd homebrew-tap
          
          # Update the cask file using printf to avoid heredoc issues
          printf '%s\n' 'cask "quickcsv" do' > Casks/quickcsv.rb
          printf '%s\n' '  version "CASK_VERSION_PLACEHOLDER"' >> Casks/quickcsv.rb
          printf '%s\n' '  sha256 "SHA256_PLACEHOLDER"' >> Casks/quickcsv.rb
          printf '%s\n' '' >> Casks/quickcsv.rb
          printf '%s\n' '  url "https://github.com/ayu5h-raj/quickcsv/releases/download/v#{version}/QuickCSV-v#{version}-macos.zip"' >> Casks/quickcsv.rb
          printf '%s\n' '  name "QuickCSV"' >> Casks/quickcsv.rb
          printf '%s\n' '  desc "High-performance CSV viewer for macOS"' >> Casks/quickcsv.rb
          printf '%s\n' '  homepage "https://github.com/ayu5h-raj/quickcsv"' >> Casks/quickcsv.rb
          printf '%s\n' '' >> Casks/quickcsv.rb
          printf '%s\n' '  postflight do' >> Casks/quickcsv.rb
          printf '%s\n' '    system_command "/usr/bin/xattr",' >> Casks/quickcsv.rb
          printf '%s\n' '                   args: ["-cr", "#{appdir}/QuickCSV.app"],' >> Casks/quickcsv.rb
          printf '%s\n' '                   sudo: false' >> Casks/quickcsv.rb
          printf '%s\n' '  end' >> Casks/quickcsv.rb
          printf '%s\n' '' >> Casks/quickcsv.rb
          printf '%s\n' '  app "QuickCSV.app"' >> Casks/quickcsv.rb
          printf '%s\n' '' >> Casks/quickcsv.rb
          printf '%s\n' '  zap trash: [' >> Casks/quickcsv.rb
          printf '%s\n' '    "~/Library/Saved Application State/com.quickcsv.savedState",' >> Casks/quickcsv.rb
          printf '%s\n' '  ]' >> Casks/quickcsv.rb
          printf '%s\n' 'end' >> Casks/quickcsv.rb
          
          # Replace placeholders with actual values
          sed -i "s/CASK_VERSION_PLACEHOLDER/${CASK_VERSION}/" Casks/quickcsv.rb
          sed -i "s/SHA256_PLACEHOLDER/${SHA256}/" Casks/quickcsv.rb
          
          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/quickcsv.rb
          git commit -m "Update QuickCSV to ${VERSION}"
          git push

  # The web app is now self-hosted on the VPS at https://www.quickcsv.in.
  # GitHub Pages just redirects there (keeps the old github.io URL working).
  build-deploy-web:
    needs: update-homebrew
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build redirect page
        run: |
          mkdir -p dist
          touch dist/.nojekyll
          cat > dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>QuickCSV has moved to www.quickcsv.in</title>
            <link rel="canonical" href="https://www.quickcsv.in/">
            <meta http-equiv="refresh" content="0; url=https://www.quickcsv.in/">
            <script>window.location.replace("https://www.quickcsv.in/");</script>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; background:#202020;
                     color:#e0e0e0; display:grid; place-items:center; height:100vh; margin:0; }
              a { color:#4ea1ff; }
            </style>
          </head>
          <body>
            <p>QuickCSV now lives at <a href="https://www.quickcsv.in/">www.quickcsv.in</a> — redirecting…</p>
          </body>
          </html>
          EOF

      - name: Deploy redirect to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
